name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Comprobar archivos de publicación
        run: |
          test -f dist/index.html
          test -f dist/vehicles.json
          test -f 'dist/downloads/Puente Entorno.exe'
          test -f dist/.nojekyll
          test -z "$(find dist -type l -print -quit)"
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
